name: stage-1-18-6

on:
  push:
    branches:
      - release/1.18.6-readable-layout

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/_stage_1_18_6.py
      - run: npm version 1.18.6 --no-git-tag-version
      - run: node --check src/web/admin-ui/public/js/editor/renderer-model.js
      - run: node --check src/web/admin-ui/public/js/editor/renderer-layout.js
      - run: node --check src/web/admin-ui/public/js/editor/renderer-svg.js
      - run: node --test tests/readable-menu-style.test.js
      - name: Commit staged release tree
        run: |
          rm .github/workflows/_stage-1-18-6.yml scripts/_stage_1_18_6.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: prepare 1.18.6 readable table geometry"
          git push
