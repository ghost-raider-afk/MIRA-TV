name: align MIRA-TV 1.18.13 browser regressions
on:
  push:
    branches:
      - fix/delayed-tv-snapshot
    paths:
      - .github/workflows/align-browser-1.18.13.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delayed-tv-snapshot
          fetch-depth: 0
      - name: Restore readable coverage and align approved fullscreen UI behavior
        run: |
          git show origin/main:tests/browser/readable-menu-fullscreen.spec.js > tests/browser/readable-menu-fullscreen.spec.js
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(); actual=text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count}, found {actual}: {old!r}')
              p.write_text(text.replace(old,new,count))

          p=Path('tests/browser/readable-menu-fullscreen.spec.js')
          text=p.read_text()
          text=text.replace(
              "test('authorized TV Player fits the visual viewport and requests fullscreen on the first TV gesture'",
              "test('authorized TV Player fits the visual viewport and makes one automatic legacy-compatible fullscreen request'",
              1
          )
          text=text.replace(
              """      value(options) {\n        window.__miraFullscreenCalls.push(options || null);\n        return Promise.resolve();\n      }\n""",
              """      value(...args) {\n        window.__miraFullscreenCalls.push(args.length);\n        return Promise.resolve();\n      }\n""",
              1
          )
          old="""    expect(await tvPage.evaluate(() => window.__miraFullscreenCalls.length)).toBe(0);\n    await player.click({ position:{ x:20, y:20 } });\n    await expect.poll(() => tvPage.evaluate(() => window.__miraFullscreenCalls.length)).toBe(1);\n    expect(await tvPage.evaluate(() => window.__miraFullscreenCalls[0]?.navigationUI)).toBe('hide');\n"""
          new="""    await expect.poll(() => tvPage.evaluate(() => window.__miraFullscreenCalls.length)).toBe(1);\n    expect(await tvPage.evaluate(() => window.__miraFullscreenCalls[0])).toBe(0);\n    await tvPage.waitForTimeout(250);\n    expect(await tvPage.evaluate(() => window.__miraFullscreenCalls.length)).toBe(1);\n"""
          if old not in text: raise SystemExit('readable fullscreen assertion anchor not found')
          p.write_text(text.replace(old,new,1))

          replace(
            'tests/browser/tv-management.spec.js',
            "    await expect(unit.locator('[data-tv-meta] .screen-tv-meta-row')).toHaveCount(2);\n    await expect(unit.locator('[data-tv-meta]')).toContainText('Статус');\n",
            "    await expect(unit.locator('[data-tv-meta] .screen-tv-meta-row')).toHaveCount(3);\n    await expect(unit.locator('[data-tv-meta]')).toContainText('Статус');\n    await expect(unit.locator('[data-tv-meta]')).toContainText('Показ');\n"
          )
          replace(
            'tests/browser/tv-management.spec.js',
            "    await expect(dialog.locator('[data-tv-management-device]')).toContainText('Fullscreen API');\n",
            "    await expect(dialog.locator('[data-tv-management-device]')).toContainText('Fullscreen API');\n    await expect(dialog.locator('[data-tv-management-device]')).toContainText('Fullscreen телеметрия');\n    await expect(dialog.locator('[data-tv-management-device]')).toContainText('Ошибка fullscreen');\n"
          )

          path='tests/browser/weather-preview-player-parity.spec.js'
          p=Path(path); text=p.read_text()
          old="""      window.WebSocket=FakeWebSocket;\n    });\n"""
          new="""      window.WebSocket=FakeWebSocket;\n      Object.defineProperty(Element.prototype, 'requestFullscreen', {\n        configurable:true,\n        value(){ return Promise.resolve(); }\n      });\n    });\n"""
          if old not in text: raise SystemExit('weather fullscreen isolation anchor not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Commit browser regression alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser/readable-menu-fullscreen.spec.js tests/browser/tv-management.spec.js tests/browser/weather-preview-player-parity.spec.js
          git diff --cached --check
          git commit -m "test: align browser checks with fullscreen runtime"
          git push origin HEAD:fix/delayed-tv-snapshot
