name: refactor-v1.0.0.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-import.yml']

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIRA-TV refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/v1.0.0.1-offline-first-rebrand
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply deterministic baseline refactor
        run: |
          python3 scripts/refactor-v1.0.0.1.py
          python3 scripts/refactor-fixes.py
          python3 scripts/refactor-fixes2.py
          python3 scripts/refactor-fixes3.py
          python3 scripts/refactor-fixes4.py
          python3 scripts/refactor-fixes5.py
          python3 scripts/refactor-fixes6.py
          python3 scripts/refactor-fixes7.py
          python3 scripts/refactor-fixes8.py

      - name: Rebuild lockfile and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Syntax check
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Remove one-shot refactor tooling
        shell: bash
        run: rm -f scripts/refactor-v1.0.0.1.py scripts/refactor-fixes.py scripts/refactor-fixes2.py scripts/refactor-fixes3.py scripts/refactor-fixes4.py scripts/refactor-fixes5.py scripts/refactor-fixes6.py scripts/refactor-fixes7.py scripts/refactor-fixes8.py

      - name: Exact final-tree audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules \
            'menu-tv|menu_tv|Menu TV|TV Menu|SFTP|sftp|TV2:|ТВ МЕНЮ' .; then
            echo 'Legacy product or removed transport identifier remains in final tree.' >&2
            exit 1
          fi
          test -f mira-tv.sh
          test ! -e menu-tv-2.sh
          test ! -e src/api/sftp
          test ! -e src/sftp
          test ! -e src/services/publish-service.js

      - name: Commit refactored baseline without workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git status --short
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Establish MIRA-TV 1.0.0.1 clean baseline'
          git push origin HEAD:refactor/v1.0.0.1-offline-first-rebrand
