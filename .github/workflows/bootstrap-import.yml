name: finalize-v1.0.0

on:
  push:
    branches: [refactor/v1.0.0-offline-first-rebrand]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize 1.0.0 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          excluded = {'.git', 'node_modules'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = data.replace('1.0.0.1', '1.0.0').replace('1.0.0-1', '1.0.0')
              if updated != data:
                  path.write_text(updated, encoding='utf-8')
          PY
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run build
          npm test
          bash -n mira-tv.sh

      - name: Validate Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i \
            -e 's|^MIRA_TV_DOMAIN=.*|MIRA_TV_DOMAIN=mira.example.test|' \
            -e 's|^MIRA_TV_ACME_EMAIL=.*|MIRA_TV_ACME_EMAIL=ops@example.test|' \
            .env
          docker compose config --quiet
          rm -f .env

      - name: Commit normalized metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize MIRA-TV 1.0.0 metadata'
          git push origin HEAD:refactor/v1.0.0-offline-first-rebrand
