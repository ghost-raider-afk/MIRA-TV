name: refactor-v1.0.0.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-import.yml']

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MIRA-TV refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/v1.0.0.1-offline-first-rebrand
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply deterministic baseline refactor
        run: |
          python3 scripts/refactor-v1.0.0.1.py
          python3 scripts/refactor-fixes.py
          python3 scripts/refactor-fixes2.py
          python3 scripts/refactor-fixes3.py

      - name: Install dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Syntax check
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Brand and SFTP audit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'menu-tv|menu_tv|Menu TV|TV Menu|SFTPGo|sftpgo|SFTP_' . \
            --exclude-dir=.git \
            --exclude='scripts/refactor-v1.0.0.1.py' \
            --exclude='scripts/refactor-fixes.py' \
            --exclude='scripts/refactor-fixes2.py' \
            --exclude='scripts/refactor-fixes3.py'
          test -f mira-tv.sh
          test ! -e menu-tv-2.sh
          test ! -e src/api/sftp
          test ! -e src/sftp

      - name: Commit refactored baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Establish MIRA-TV 1.0.0.1 clean baseline' || exit 0
          git push origin HEAD:refactor/v1.0.0.1-offline-first-rebrand
