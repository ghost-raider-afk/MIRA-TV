name: brand-normalize

on:
  push:
    branches: [refactor/v1.0.0-offline-first-rebrand]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize brand text
        run: python3 scripts/normalize-brand.py
      - name: Commit normalized files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove final legacy brand text'
          git push origin HEAD:refactor/v1.0.0-offline-first-rebrand
