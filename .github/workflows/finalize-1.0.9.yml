name: finalize-1-0-9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-1.0.9.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump installer and remove helper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^SCRIPT_VERSION="1\.0\.8"$/SCRIPT_VERSION="1.0.9"/' mira-tv.sh
          grep -qx 'SCRIPT_VERSION="1.0.9"' mira-tv.sh
          rm -f .github/workflows/finalize-1.0.9.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mira-tv.sh .github/workflows/finalize-1.0.9.yml
          git commit -m 'chore: prepare 1.0.9 installer [skip ci]'
          git push origin HEAD:main
