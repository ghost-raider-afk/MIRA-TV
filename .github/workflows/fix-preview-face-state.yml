name: fix-preview-face-state

on:
  push:
    branches: [release/1.18.7]
    paths: [.github/workflows/fix-preview-face-state.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.18.7
      - run: python3 tools/fix-preview-face-state.py
      - run: node --check src/web/admin-ui/public/js/pages/screens.js
      - name: Remove one-shot files
        run: rm -f tools/fix-preview-face-state.py .github/workflows/fix-preview-face-state.yml
      - name: Commit root-cause fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve loaded TV frame across status refresh"
          git push origin HEAD:release/1.18.7
