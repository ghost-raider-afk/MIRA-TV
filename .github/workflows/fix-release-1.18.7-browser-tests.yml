name: fix-release-1.18.7-browser-tests

on:
  push:
    branches: [release/1.18.7]
    paths: [.github/workflows/fix-release-1.18.7-browser-tests.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.18.7
      - name: Apply test-only fixes
        run: python3 tools/fix-release-1.18.7-browser-tests.py
      - name: Remove one-shot files
        run: rm -f tools/fix-release-1.18.7-browser-tests.py .github/workflows/fix-release-1.18.7-browser-tests.yml
      - name: Commit final test tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: cover event-driven preview lifecycle"
          git push origin HEAD:release/1.18.7
