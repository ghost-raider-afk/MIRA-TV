name: hotfix-lock

on:
  push:
    branches:
      - hotfix/v1.0.5-clean-install

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/v1.0.5-clean-install

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate lockfile from package manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Commit canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already canonical.'
            exit 0
          fi
          git commit -m 'chore: regenerate 1.0.5 lockfile'
          git push origin HEAD:hotfix/v1.0.5-clean-install
