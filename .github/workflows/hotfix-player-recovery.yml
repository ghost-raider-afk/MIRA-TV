name: hotfix-player-recovery

on:
  push:
    branches:
      - fix/player-recovery-1.18.11

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-recovery-1.18.11
          fetch-depth: 0
      - name: Apply recovery patch
        run: python3 scripts/hotfix-player-recovery.py
      - name: Commit recovery patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/hotfix-player-recovery.yml scripts/hotfix-player-recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'release: prepare MIRA-TV 1.18.11 Player recovery'
          git push origin HEAD:fix/player-recovery-1.18.11
