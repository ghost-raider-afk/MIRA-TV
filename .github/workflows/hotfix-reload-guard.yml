name: hotfix-reload-guard

on:
  push:
    branches:
      - fix/player-shell-convergence-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-shell-convergence-v2
          fetch-depth: 0
      - name: Keep reload marker until build converges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/web/admin-ui/public/js/player/player.js')
          text = path.read_text(encoding='utf-8')
          old = """  if (storedReloadVersion() === serverVersion) {\n    clearReloadVersion();\n    schedulePlayerBuildRetry(serverVersion);\n    return;\n  }\n"""
          new = """  if (storedReloadVersion() === serverVersion) {\n    schedulePlayerBuildRetry(serverVersion);\n    return;\n  }\n"""
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected Player reload guard block not found')
          PY
      - name: Commit patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/web/admin-ui/public/js/player/player.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/admin-ui/public/js/player/player.js
          git commit -m 'fix: avoid duplicate Player shell update after reload'
          git push origin HEAD:fix/player-shell-convergence-v2
