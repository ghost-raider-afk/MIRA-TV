name: hotfix-version-align

on:
  push:
    branches:
      - fix/player-shell-convergence-v2

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-shell-convergence-v2
          fetch-depth: 0

      - name: Align release metadata exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lock = Path('package-lock.json')
          text = lock.read_text(encoding='utf-8')
          old = '"version": "1.18.9"'
          new = '"version": "1.18.10"'
          if text.count(old) != 2:
              raise SystemExit(f'Expected exactly two root 1.18.9 lock versions, found {text.count(old)}')
          lock.write_text(text.replace(old, new, 2), encoding='utf-8')

          installer = Path('mira-tv.sh')
          text = installer.read_text(encoding='utf-8')
          old = 'SCRIPT_VERSION="1.18.9"'
          new = 'SCRIPT_VERSION="1.18.10"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one installer version, found {text.count(old)}')
          installer.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit aligned metadata if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json mira-tv.sh; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json mira-tv.sh
          git commit -m 'release: align 1.18.10 lockfile and installer'
          git push origin HEAD:fix/player-shell-convergence-v2
