name: patch fullscreen status UI
on:
  push:
    branches:
      - fix/delayed-tv-snapshot
    paths:
      - .github/workflows/patch-fullscreen-status.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delayed-tv-snapshot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch fullscreen status UI
        run: |
          python - <<'PY'
          from pathlib import Path

          screens = Path('src/web/admin-ui/public/js/pages/screens.js')
          text = screens.read_text()

          old = """function cardMetaRows(_screen, binding) {\n  const status = statusState(binding);\n  return [\n    ['Статус', status.title, status.key],\n    ['Последняя связь', latestSeen(binding) ? formatDate(latestSeen(binding)) : '—', '']\n  ];\n}\n"""
          new = """function fullscreenCardState(binding) {\n  const mode = String(binding?.player_fullscreen?.metadata?.mode || '');\n  if (['fullscreen-api', 'display-fullscreen', 'standalone'].includes(mode)) return { title:'Fullscreen', key:'fullscreen' };\n  if (mode === 'browser') return { title:'Окно', key:'window' };\n  return { title:binding ? 'Нет данных' : '—', key:'unknown' };\n}\n\nfunction cardMetaRows(_screen, binding) {\n  const status = statusState(binding);\n  const display = fullscreenCardState(binding);\n  return [\n    ['Статус', status.title, status.key],\n    ['Показ', display.title, display.key],\n    ['Последняя связь', latestSeen(binding) ? formatDate(latestSeen(binding)) : '—', '']\n  ];\n}\n"""
          if old not in text:
              raise SystemExit('cardMetaRows anchor not found')
          text = text.replace(old, new, 1)

          old = """function fullscreenApiText(binding) {\n  const metadata = binding?.player_fullscreen?.metadata;\n  if (!binding) return '—';\n  if (!metadata) return 'Нет данных';\n  if (metadata.request_supported !== true) return 'Не поддерживается';\n  return metadata.fullscreen_enabled === true ? 'Доступен' : 'Ограничен браузером';\n}\n"""
          new = old + """\nfunction fullscreenErrorText(binding) {\n  const error = String(binding?.player_fullscreen?.metadata?.last_error || '').trim();\n  return error || '—';\n}\n\nfunction fullscreenTelemetryText(binding) {\n  const receivedAt = binding?.player_fullscreen?.server_received_at;\n  return receivedAt ? formatDate(receivedAt) : '—';\n}\n"""
          if old not in text:
              raise SystemExit('fullscreenApiText anchor not found')
          text = text.replace(old, new, 1)

          old = """    ['Ping', pingText(screen.id, binding), ''],\n    ['Режим экрана', fullscreenModeText(binding), ''],\n    ['Fullscreen API', fullscreenApiText(binding), '']\n"""
          new = """    ['Ping', pingText(screen.id, binding), ''],\n    ['Режим экрана', fullscreenModeText(binding), ''],\n    ['Fullscreen API', fullscreenApiText(binding), ''],\n    ['Fullscreen телеметрия', fullscreenTelemetryText(binding), ''],\n    ['Ошибка fullscreen', fullscreenErrorText(binding), '']\n"""
          if old not in text:
              raise SystemExit('metaRows anchor not found')
          text = text.replace(old, new, 1)

          old = """    text.textContent = value;\n    if (label === 'Статус') text.className = `is-${stateKey}`;\n"""
          new = """    text.textContent = value;\n    if (stateKey) text.className = `is-${stateKey}`;\n"""
          if old not in text:
              raise SystemExit('fillRows anchor not found')
          text = text.replace(old, new, 1)
          screens.write_text(text)

          css = Path('src/web/admin-ui/public/css/pages/screens.css')
          text = css.read_text()
          anchor = '.screen-tv-meta-row strong.is-unbound{color:var(--ui-text-muted)}'
          addition = anchor + '.screen-tv-meta-row strong.is-fullscreen{color:var(--ui-success)}.screen-tv-meta-row strong.is-window{color:var(--ui-warning)}.screen-tv-meta-row strong.is-unknown{color:var(--ui-text-muted)}'
          if anchor not in text:
              raise SystemExit('screens css anchor not found')
          text = text.replace(anchor, addition, 1)
          css.write_text(text)

          test = Path('tests/fullscreen-diagnostics.test.js')
          text = test.read_text()
          old = """  assert.match(screens, /Режим экрана/);\n  assert.match(screens, /Fullscreen API/);\n"""
          new = """  assert.match(screens, /Показ/);\n  assert.match(screens, /Режим экрана/);\n  assert.match(screens, /Fullscreen API/);\n  assert.match(screens, /Fullscreen телеметрия/);\n  assert.match(screens, /Ошибка fullscreen/);\n  assert.match(fullscreen, /last_error/);\n"""
          if old not in text:
              raise SystemExit('fullscreen diagnostics test anchor not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/web/admin-ui/public/js/pages/screens.js src/web/admin-ui/public/css/pages/screens.css tests/fullscreen-diagnostics.test.js
          git diff --cached --check
          git commit -m "feat: surface fullscreen state in TV network" || exit 0
          git push origin HEAD:fix/delayed-tv-snapshot
