name: preflight-version-sync

on:
  push:
    branches:
      - release-1.9.0-preflight

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release-1.9.0-preflight

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Synchronize release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = '1.9.0'
          grep -qx 'MIRA_TV_VERSION=1.9.0' .env.example
          grep -qx 'SCRIPT_VERSION="1.9.0"' mira-tv.sh
          npm install --package-lock-only --ignore-scripts
          sed -i "s/MIRA_TV_VERSION: '1\.0\.9'/MIRA_TV_VERSION: '1.9.0'/" .github/workflows/check.yml
          grep -qx "      MIRA_TV_VERSION: '1.9.0'" .github/workflows/check.yml

      - name: Commit synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json .github/workflows/check.yml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/check.yml
          git commit -m 'release: sync 1.9.0 version sources'
          git push origin HEAD:release-1.9.0-preflight
