name: prepare-release-1.0.8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-release-1.0.8.yml

permissions:
  contents: write

jobs:
  prepare-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and bump canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          git show v1.0.7:package-lock.json > package-lock.json
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '1.0.8';
          lock.packages[''].version = '1.0.8';
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          git diff --check
          node -e "const l=require('./package-lock.json'); if(l.version!=='1.0.8'||l.packages[''].version!=='1.0.8') process.exit(1)"

      - name: Commit canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: prepare 1.0.8 lockfile [skip ci]'
          git push origin HEAD:main
