name: prepare-v1.0.4

on:
  push:
    branches:
      - release-prep-v1.0.4

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release preparation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build clean release commit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='850d1f6dbe79c5635a1fb6445f97f3b27a61fd8b'
          VERSION='1.0.4'

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

          npm version "$VERSION" --no-git-tag-version
          npm install --package-lock-only --ignore-scripts

          sed -i -E "s/^# MIRA-TV [0-9]+\.[0-9]+\.[0-9]+$/# MIRA-TV ${VERSION}/" .env.example
          sed -i -E "s/^MIRA_TV_VERSION=.*/MIRA_TV_VERSION=${VERSION}/" .env.example
          sed -i -E "s/^SCRIPT_VERSION=.*/SCRIPT_VERSION=\"${VERSION}\"/" mira-tv.sh
          sed -i -E "s/MIRA_TV_VERSION: '[0-9]+\.[0-9]+\.[0-9]+'/MIRA_TV_VERSION: '${VERSION}'/" .github/workflows/check.yml
          sed -i 's/mira-tv-player-shell-v17/mira-tv-player-shell-v18/g' tests/device-player-architecture.test.js

          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 1.0.3 — 29 августа 2026'
          section = '''## 1.0.4 — 9 сентября 2026

Стабилизационный выпуск MIRA-TV после эксплуатационного и browser-тестирования Player.

### Экран телевизора

- исправлено расхождение положения названия бренда между Preview и реальным Player: координаты `X/Y` теперь управляют абсолютным объектом сцены;
- добавлены многострочное название бренда и уменьшение межстрочного интервала без деформации текста;
- погода отображается прозрачным информером поверх общей сцены без собственной карточки-фона;
- Player использует единый стек слоёв сцены для меню, окружения, эффектов, контента, Entity, бренда и объявления;
- усилено offline-first восстановление последнего корректного состояния, realtime-синхронизация и устойчивость к обновлению страницы;
- шрифты Player закреплены за локальными DejaVu-ресурсами, чтобы Preview и разные телевизоры использовали одинаковые метрики текста;
- Service Worker обновлён и кэширует необходимые локальные шрифты для автономного запуска.

### Анимация и сцены

- доработаны Playlist Studio, Scene Playlist, Brand Entity, Announcement, Environment и Entity runtime;
- аквариум работает как эффект слоя Environment, без отдельного конкурирующего архитектурного слоя;
- тяжёлые покадровые операции для Video Entity не выполняются в Player;
- анимация скрытых пикселей и видео при невидимой странице приостанавливается.

### Подключение ТВ и надёжность

- усилена логика QR-активации, повторного подключения и сохранения физической идентичности телевизора;
- один монитор имеет одну активную привязку телевизора, замена и отвязка корректно отзывают старую сессию;
- улучшена работа подключения ТВ на мобильных устройствах и диагностика камеры/QR.

### Производительность и контроль качества

- добавлен browser-аудит реального Player в 1920×1080 с меню, брендом, погодой и анимированным окружением;
- добавлены автоматические бюджеты DOM, JS heap, main thread, сетевых запросов и передаваемых данных;
- текущий контрольный прогон Player: около 4 MiB используемого JS heap, менее 1% загрузки main thread и около 0.21 MiB сетевой передачи без ошибок консоли;
- добавлены regression-проверки геометрии бренда и детерминированных локальных шрифтов.
'''
          if f'## 1.0.4' not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG marker for 1.0.3 not found')
              text = text.replace(marker, section + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = '1.0.4'
          package = json.loads(Path('package.json').read_text())
          lock = json.loads(Path('package-lock.json').read_text())
          assert package['version'] == expected
          assert package['miraVersion'] == expected
          assert lock['version'] == expected
          assert lock['packages']['']['version'] == expected
          assert f'MIRA_TV_VERSION={expected}' in Path('.env.example').read_text().splitlines()
          assert f'SCRIPT_VERSION="{expected}"' in Path('mira-tv.sh').read_text().splitlines()
          assert "MIRA_TV_VERSION: '1.0.4'" in Path('.github/workflows/check.yml').read_text()
          PY

          npm ci
          npm run build
          npm test
          bash -n mira-tv.sh

          rm .github/workflows/prepare-v1.0.4.yml
          git config user.name 'MIRA-TV Release Bot'
          git config user.email 'mira-tv-release@users.noreply.github.com'
          git add -A
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'release: MIRA-TV 1.0.4' | git commit-tree "$tree" -p "$BASE_SHA")"
          git push --force origin "$commit:refs/heads/release-prep-v1.0.4"
          echo "Release commit: $commit"
