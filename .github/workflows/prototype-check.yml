name: prototype-check

on:
  push:
    branches:
      - prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Syntax and unit tests
        run: |
          npm run build
          npm test
          bash -n mira-tv.sh

      - name: Compose syntax
        run: |
          cp .env.example .env
          docker compose config --quiet
