name: publish-1-0-9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-1.0.9.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Create release commit
        shell: bash
        env:
          CHANGELOG_SECTION_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 1.0.8 — 17 сентября 2026'
          section = base64.b64decode(os.environ['CHANGELOG_SECTION_B64']).decode('utf-8')
          assert marker in text
          assert '## 1.0.9 — 17 сентября 2026' not in text
          path.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/publish-1.0.9.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/publish-1.0.9.yml
          git commit -m 'release: 1.0.9'
          git push origin HEAD:main
