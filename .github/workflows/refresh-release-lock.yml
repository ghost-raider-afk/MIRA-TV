name: refresh-release-lock

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'chore: prepare MIRA-TV 1.0.6'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh package lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh 1.0.6 package lock'
          git push origin HEAD:main
