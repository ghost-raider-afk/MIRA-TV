name: normalize-release-lock

on:
  push:
    branches:
      - release/1.18.4-ui-guards

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove accidental lock metadata and verify release-only diff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('package-lock.json')
          lines = path.read_text().splitlines(keepends=True)
          needle = '        "es-define-property": "^1.0.0",\n'
          matches = [
              index for index, line in enumerate(lines)
              if line == needle
              and index > 0
              and index + 1 < len(lines)
              and '"define-data-property": "^1.1.4"' in lines[index - 1]
              and '"es-errors": "^1.3.0"' in lines[index + 1]
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one accidental lock metadata line, found {len(matches)}')
          del lines[matches[0]]
          path.write_text(''.join(lines))
          PY
          git diff -- package-lock.json
          read additions deletions _ < <(git diff --numstat origin/main -- package-lock.json)
          test "$additions" = "2"
          test "$deletions" = "2"
      - name: Commit normalized lockfile and remove one-off workflow
        shell: bash
        run: |
          git rm .github/workflows/release-lock-normalize.yml
          git add package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: normalize 1.18.4 lockfile metadata"
          git push origin HEAD:release/1.18.4-ui-guards
