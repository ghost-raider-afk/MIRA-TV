name: normalize-release-lock

on:
  push:
    branches:
      - release/1.18.4-ui-guards

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove accidental lock metadata and verify release-only diff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('package-lock.json')
          text = path.read_text()
          target = '''        "define-data-property": "^1.1.4",
          "es-define-property": "^1.0.0",
          "es-errors": "^1.3.0",'''
          replacement = '''        "define-data-property": "^1.1.4",
          "es-errors": "^1.3.0",'''
          if text.count(target) != 1:
              raise SystemExit('expected exactly one accidental lock metadata sequence')
          path.write_text(text.replace(target, replacement, 1))
          PY
          git diff -- package-lock.json
          test "$(git diff --numstat main...HEAD -- package-lock.json 2>/dev/null | awk '{print $1":"$2}')" != ""
      - name: Commit normalized lockfile and remove one-off workflow
        shell: bash
        run: |
          git rm .github/workflows/release-lock-normalize.yml
          git add package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: normalize 1.18.4 lockfile metadata"
          git push origin HEAD:release/1.18.4-ui-guards
