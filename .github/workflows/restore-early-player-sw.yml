name: restore-early-player-sw

on:
  push:
    branches:
      - fix/player-recovery-1.18.11

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-recovery-1.18.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore proven startup registration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          player = Path('src/web/admin-ui/public/js/player/player.js')
          text = player.read_text(encoding='utf-8')
          old = "const registration = await navigator.serviceWorker.register(`/player-sw.js?v=${encodeURIComponent(PLAYER_BUILD_VERSION)}`, { scope:'/player', updateViaCache:'none' });"
          new = "const registration = await navigator.serviceWorker.register('/player-sw.js', { scope: '/player' });"
          if old not in text:
              raise SystemExit('versioned SW registration not found')
          player.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/player-bugfix-regressions.test.js')
          text = tests.read_text(encoding='utf-8')
          old = "test('Player registers the update worker before LKG restore and bypasses HTTP script cache', async () => {\n  const source = await readFile(new URL('../src/web/admin-ui/public/js/player/player.js', import.meta.url), 'utf8');\n  assert.match(source, /register\\(`\\/player-sw\\.js\\?v=\\$\\{encodeURIComponent\\(PLAYER_BUILD_VERSION\\)\\}`,[^\\n]*updateViaCache:'none'/);\n  const initialise = source.match(/async function initialisePlayer\\(\\) \\{[\\s\\S]*?\\n}\\n\\nvoid initialisePlayer/)?.[0] || '';\n  assert.ok(initialise.indexOf('void registerOfflinePlayer();') < initialise.indexOf('restoreLastKnownGood()'));\n  assert.match(source, /player\\.boot', \\{ restored, build:PLAYER_BUILD_VERSION \\}/);\n});"
          new = "test('Player registers the Offline shell during startup before LKG restore', async () => {\n  const source = await readFile(new URL('../src/web/admin-ui/public/js/player/player.js', import.meta.url), 'utf8');\n  assert.match(source, /navigator\\.serviceWorker\\.register\\('\/player-sw\\.js', \\{ scope: '\/player' \\}\\)/);\n  assert.doesNotMatch(source, /player-sw\\.js\\?v=|updateViaCache/);\n  const initialise = source.match(/async function initialisePlayer\\(\\) \\{[\\s\\S]*?\\n}\\n\\nvoid initialisePlayer/)?.[0] || '';\n  assert.ok(initialise.indexOf('void registerOfflinePlayer();') < initialise.indexOf('restoreLastKnownGood()'));\n  assert.match(source, /player\\.boot', \\{ restored, build:PLAYER_BUILD_VERSION \\}/);\n});"
          if old not in text:
              raise SystemExit('registration regression test not found')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')

          notes = Path('docs/releases/1.18.11.md')
          text = notes.read_text(encoding='utf-8')
          text = text.replace('- Uses a versioned Service Worker URL with `updateViaCache: none` for future releases.\n', '- Restores the proven plain `/player-sw.js` registration path during Player startup.\n')
          notes.write_text(text, encoding='utf-8')
          PY
          npm ci
          node --test tests/player-bugfix-regressions.test.js tests/player-shell-upgrade.test.js
          git rm .github/workflows/restore-early-player-sw.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/admin-ui/public/js/player/player.js tests/player-bugfix-regressions.test.js docs/releases/1.18.11.md
          git commit -m 'fix: restore early Player service worker registration'
          git push origin HEAD:fix/player-recovery-1.18.11
