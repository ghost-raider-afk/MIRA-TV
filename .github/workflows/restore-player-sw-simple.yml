name: restore-player-sw-simple

on:
  push:
    branches:
      - fix/player-recovery-1.18.11

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-recovery-1.18.11
      - name: Restore plain Player SW registration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/web/admin-ui/public/js/player/player.js')
          s = p.read_text(encoding='utf-8')
          old = "const registration = await navigator.serviceWorker.register(`/player-sw.js?v=${encodeURIComponent(PLAYER_BUILD_VERSION)}`, { scope:'/player', updateViaCache:'none' });"
          new = "const registration = await navigator.serviceWorker.register('/player-sw.js', { scope: '/player' });"
          if old not in s:
              raise SystemExit('expected registration line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check src/web/admin-ui/public/js/player/player.js
          git rm .github/workflows/restore-player-sw-simple.yml .github/workflows/restore-early-player-sw.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/admin-ui/public/js/player/player.js
          git commit -m 'fix: restore plain early Player SW registration'
          git push origin HEAD:fix/player-recovery-1.18.11
