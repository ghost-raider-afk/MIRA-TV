name: stage-release-1.18.5

on:
  push:
    branches:
      - release/1.18.5

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.18.5
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.18.5 --no-git-tag-version
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          if package.get('version') != '1.18.5':
              raise SystemExit(f"package version after npm version: {package.get('version')!r}")
          package['miraVersion'] = '1.18.5'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_once('.env.example', 'MIRA_TV_VERSION=1.18.4', 'MIRA_TV_VERSION=1.18.5')
          replace_once('mira-tv.sh', 'SCRIPT_VERSION="1.18.4"', 'SCRIPT_VERSION="1.18.5"')
          replace_once('src/web/admin-ui/public/js/player/player.js', "const PLAYER_BUILD_VERSION = '1.18.4';", "const PLAYER_BUILD_VERSION = '1.18.5';")
          replace_once('src/web/admin-ui/public/player-sw.js', "const RETIRED_SHELL_CACHE = 'mira-tv-player-shell-v63';", "const RETIRED_SHELL_CACHE = 'mira-tv-player-shell-v64';")
          replace_once('src/web/admin-ui/public/player-sw.js', "const SHELL_CACHE = 'mira-tv-player-shell-v64';", "const SHELL_CACHE = 'mira-tv-player-shell-v65';")
          replace_once(
              'src/web/admin-ui/public/player-sw.js',
              '// Source revision: readable menu layout and TV-browser fullscreen viewport support.',
              '// Source revision: classic row-tone parity, protected price zone and catalog address metadata.'
          )
          PY
          cat > docs/releases/1.18.5.md <<'EOF'
          # MIRA-TV 1.18.5

          Patch-релиз читаемости TV-меню и метаданных каталога после v1.18.4.

          - Readable-таблица теперь использует ту же `tone`-логику, что классическая таблица: цвет названия, второй строки и обеих цен `1 л` / `1,5 л` наследуется от классической строки без отдельной палитры.
          - Для цен выделена защищённая геометрическая зона, поэтому длинное название и мета-строка не могут заходить под ценовые колонки; вертикальный интервал между названием и метаданными увеличен.
          - TV-метаданные приведены к компактному виду `производитель • крепость • характеристики`; адрес товара в TV SVG не выводится.
          - В каталог добавлено отдельное поле «Адрес» через additive migration `034-catalog-product-address`; исторические миграции не переписывались.
          - Адрес поддержан в API, форме каталога и CSV import/export/preview. Старые CSV без колонки «Адрес» сохраняют существующее значение, а пустая ячейка в новом формате позволяет адрес явно очистить.
          - Editor, Preview и TV продолжают использовать общий канонический renderer; отдельной визуальной реализации для readable-режима не добавлено.
          - Offline Player shell поднят до v65, чтобы подключённые ТВ атомарно получили обновлённые renderer/layout assets. Player build — 1.18.5.
          - Новых runtime-зависимостей нет; существующие сцены, Local-first Player, Docker volumes и PostgreSQL-данные сохраняют совместимость.
          EOF

      - name: Focused release checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = '1.18.5'
          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          assert package['version'] == expected
          assert package['miraVersion'] == expected
          assert lock['version'] == expected
          assert lock['packages']['']['version'] == expected
          assert f'MIRA_TV_VERSION={expected}' in Path('.env.example').read_text(encoding='utf-8').splitlines()
          assert f'SCRIPT_VERSION="{expected}"' in Path('mira-tv.sh').read_text(encoding='utf-8').splitlines()
          assert f"const PLAYER_BUILD_VERSION = '{expected}';" in Path('src/web/admin-ui/public/js/player/player.js').read_text(encoding='utf-8').splitlines()
          sw = Path('src/web/admin-ui/public/player-sw.js').read_text(encoding='utf-8')
          assert "RETIRED_SHELL_CACHE = 'mira-tv-player-shell-v64'" in sw
          assert "SHELL_CACHE = 'mira-tv-player-shell-v65'" in sw
          PY
          node --test tests/player-bugfix-regressions.test.js tests/player-shell-generic-scene.test.js
          git diff --check

      - name: Commit staged release
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage-release-1.18.5.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .env.example package.json package-lock.json mira-tv.sh \
            src/web/admin-ui/public/js/player/player.js \
            src/web/admin-ui/public/player-sw.js \
            docs/releases/1.18.5.md
          git diff --cached --check
          git commit -m 'release: prepare MIRA-TV 1.18.5'
          git push origin HEAD:release/1.18.5
