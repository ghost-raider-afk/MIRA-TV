name: stage-release-1.18.7

on:
  push:
    branches: [release/1.18.7]
    paths: [.github/workflows/stage-release-1.18.7.yml]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.18.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply release patch and focused checks
        run: python3 tools/stage-release-1.18.7.py
      - name: Remove one-shot staging files
        run: rm -f tools/stage-release-1.18.7.py .github/workflows/stage-release-1.18.7.yml
      - name: Commit staged release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: prepare MIRA-TV 1.18.7"
          git push origin HEAD:release/1.18.7
