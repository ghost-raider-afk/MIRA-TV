name: Stage address CSV compatibility

on:
  push:
    branches:
      - fix/readable-menu-address-field

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readable-menu-address-field
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply compatibility patch
        run: python3 scripts/tmp-address-csv-compat.py
      - name: Run focused regressions
        run: node --test tests/readable-menu-style.test.js tests/catalog-csv.test.js tests/catalog-import-preview.test.js tests/catalog-product-address.test.js
      - name: Commit staged result
        shell: bash
        run: |
          rm scripts/tmp-address-csv-compat.py .github/workflows/tmp-address-csv-compat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: preserve addresses for legacy catalog CSV"
          git push origin HEAD:fix/readable-menu-address-field
