name: tmp-bump-1.18.12

on:
  push:
    branches:
      - release/1.18.12-soft-reprovision
    paths:
      - .github/workflows/tmp-bump-1.18.12.yml

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.18.12-soft-reprovision
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bump release metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.18.12 --no-git-tag-version
          sed -i 's/^MIRA_TV_VERSION=1\.18\.11$/MIRA_TV_VERSION=1.18.12/' .env.example
          sed -i 's/^SCRIPT_VERSION="1\.18\.11"$/SCRIPT_VERSION="1.18.12"/' mira-tv.sh
          sed -i "s/^const PLAYER_BUILD_VERSION = '1\.18\.11';$/const PLAYER_BUILD_VERSION = '1.18.12';/" src/web/admin-ui/public/js/player/player.js
          sed -i "s/^const RETIRED_SHELL_CACHE = 'mira-tv-player-shell-v71';$/const RETIRED_SHELL_CACHE = 'mira-tv-player-shell-v72';/" src/web/admin-ui/public/player-sw.js
          sed -i "s/^const SHELL_CACHE = 'mira-tv-player-shell-v72';$/const SHELL_CACHE = 'mira-tv-player-shell-v73';/" src/web/admin-ui/public/player-sw.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .env.example mira-tv.sh src/web/admin-ui/public/js/player/player.js src/web/admin-ui/public/player-sw.js
          git commit -m 'release: align MIRA-TV 1.18.12 versions'
          git push origin HEAD:release/1.18.12-soft-reprovision
