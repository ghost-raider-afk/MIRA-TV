name: Stage readable menu fixes

on:
  push:
    branches:
      - fix/readable-menu-address-field

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readable-menu-address-field
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp-readable-menu-address.py')
          text = p.read_text()
          text = text.replace(
              '<label class="field"><span>Производитель</span><input id="product-producer" maxlength="120" /></label><label class="field"><span>Крепость</span>',
              '<label class="field"><span>Производитель</span><input id="product-producer" maxlength="120" /></label>\\n                <label class="field"><span>Крепость</span>'
          )
          p.write_text(text)
          PY
          python3 scripts/tmp-readable-menu-address.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/readable-menu-style.test.js')
          text = p.read_text()
          old = '''  assert.match(svg, new RegExp(`tone-light[\\s\\S]*fill=\\"${layout.palette.primaryText}\\"[\\s\\S]*table-item-prices[\\s\\S]*fill=\\"${layout.palette.primaryText}\\"`));\n  assert.match(svg, new RegExp(`tone-accent[\\s\\S]*fill=\\"${layout.palette.accentText}\\"[\\s\\S]*table-item-prices[\\s\\S]*fill=\\"${layout.palette.accentText}\\"`));'''
          new = '''  const lightStart = svg.indexOf('tone-light');\n  const accentStart = svg.indexOf('tone-accent');\n  const lightRow = svg.slice(lightStart, accentStart);\n  const accentRow = svg.slice(accentStart);\n  assert.match(lightRow, new RegExp(`class=\\"item-name\\"[^>]*fill=\\"${layout.palette.primaryText}\\"`));\n  assert.match(lightRow, new RegExp(`class=\\"item-meta\\"[^>]*fill=\\"${layout.palette.secondaryText}\\"`));\n  assert.equal((lightRow.match(new RegExp(`class=\\"price\\"[^>]*fill=\\"${layout.palette.primaryText}\\"`, 'g')) || []).length, 2);\n  assert.match(accentRow, new RegExp(`class=\\"item-name\\"[^>]*fill=\\"${layout.palette.accentText}\\"`));\n  assert.match(accentRow, new RegExp(`class=\\"item-meta\\"[^>]*fill=\\"${layout.palette.accentSecondaryText}\\"`));\n  assert.equal((accentRow.match(new RegExp(`class=\\"price\\"[^>]*fill=\\"${layout.palette.accentText}\\"`, 'g')) || []).length, 2);'''
          if old not in text:
              raise SystemExit('readable tone assertion patch not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Run focused regressions
        run: node --test tests/readable-menu-style.test.js tests/catalog-csv.test.js tests/catalog-import-preview.test.js tests/catalog-product-address.test.js
      - name: Commit staged result
        shell: bash
        run: |
          rm scripts/tmp-readable-menu-address.py .github/workflows/tmp-readable-menu-address.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: improve readable menu metadata and tones"
          git push origin HEAD:fix/readable-menu-address-field
