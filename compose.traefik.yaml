# Optional reverse proxy: COMPOSE_FILE=compose.yaml:compose.traefik.yaml
# Host ports: 80/tcp and 443/tcp; upstream app:8080 (HTTP and WebSocket).
# db:5432 stays private on mira-tv-internal. Future bot:8090 not routed yet.
services:
  proxy-config-init:
    image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    container_name: mira-tv-proxy-config-init
    environment:
      MIRA_TV_DOMAIN: ${MIRA_TV_DOMAIN:?MIRA_TV_DOMAIN must be set}
    command:
      - sh
      - -ec
      - |
        printf 'http:\n  routers:\n    mira-tv-login:\n      rule: "Host(\140%s\140) && Path(\140/api/auth/login\140) && Method(\140POST\140)"\n      priority: 100\n      entryPoints: [websecure]\n      middlewares: [mira-tv-login-rate-limit]\n      service: mira-tv\n      tls:\n        certResolver: letsencrypt\n    mira-tv-device-activation:\n      rule: "Host(\140%s\140) && Path(\140/api/device/activations\140) && Method(\140POST\140)"\n      priority: 90\n      entryPoints: [websecure]\n      middlewares: [mira-tv-device-activation-rate-limit]\n      service: mira-tv\n      tls:\n        certResolver: letsencrypt\n    mira-tv:\n      rule: "Host(\140%s\140)"\n      entryPoints: [websecure]\n      service: mira-tv\n      tls:\n        certResolver: letsencrypt\n  middlewares:\n    mira-tv-login-rate-limit:\n      rateLimit:\n        average: 30\n        period: 1m\n        burst: 10\n    mira-tv-device-activation-rate-limit:\n      rateLimit:\n        average: 120\n        period: 1m\n        burst: 40\n  services:\n    mira-tv:\n      loadBalancer:\n        servers:\n          - url: "http://app:8080"\n' "$$MIRA_TV_DOMAIN" "$$MIRA_TV_DOMAIN" "$$MIRA_TV_DOMAIN" > /dynamic/dynamic.yml
    volumes:
      - mira-tv-proxy-config:/dynamic
    network_mode: none
    restart: "no"

  proxy:
    image: traefik:v3.7.12@sha256:5447d0eaf375d832b8f224f88db0e80c0a2d44554fc973e3ba72c3a52946cfcc
    container_name: mira-tv-proxy
    restart: unless-stopped
    mem_limit: ${PROXY_MEMORY_LIMIT}
    pids_limit: ${PROXY_PIDS_LIMIT}
    security_opt: [no-new-privileges:true]
    depends_on:
      app:
        condition: service_healthy
      proxy-config-init:
        condition: service_completed_successfully
    command:
      - --providers.file.filename=/dynamic/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${MIRA_TV_ACME_EMAIL:?MIRA_TV_ACME_EMAIL must be set}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - mira-tv-proxy-config:/dynamic:ro
      - mira-tv-letsencrypt:/letsencrypt
    networks: [mira-tv-proxy]
volumes:
  mira-tv-letsencrypt:
    name: mira-tv-letsencrypt
  mira-tv-proxy-config:
    name: mira-tv-proxy-config
