services:
  db:
    image: postgres:17-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
    container_name: menu-tv-2-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - menu-tv-2-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT}
    pids_limit: ${DB_PIDS_LIMIT}
    networks:
      - menu-tv-2-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sftp-storage-init:
    image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    container_name: menu-tv-2-sftp-storage-init
    command: >-
      sh -ec 'mkdir -p /srv/menu-tv-sftp && chown 1000:11000 /srv/menu-tv-sftp && chmod 2770 /srv/menu-tv-sftp'
    volumes:
      - menu-tv-2-sftp-data:/srv/menu-tv-sftp
    restart: "no"
    networks:
      - menu-tv-2-internal

  site-assets-init:
    image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    container_name: menu-tv-2-site-assets-init
    env_file:
      - .env
    command: >-
      sh -ec 'mkdir -p "$$SITE_ASSETS_ROOT" && chown 10001:11000 "$$SITE_ASSETS_ROOT" && chmod 2770 "$$SITE_ASSETS_ROOT"'
    volumes:
      - menu-tv-2-site-assets:${SITE_ASSETS_ROOT}
    restart: "no"
    networks:
      - menu-tv-2-internal

  sftp:
    image: drakkan/sftpgo:v2.7.5-slim@sha256:021e23c5336ebf0a12b663dcb773081f7537e0ef330cbd1534f446ce26c77faa
    container_name: menu-tv-2-sftp
    user: "1000:11000"
    env_file:
      - .env
    environment:
      SFTPGO_DATA_PROVIDER__DRIVER: postgresql
      SFTPGO_DATA_PROVIDER__HOST: db
      SFTPGO_DATA_PROVIDER__PORT: 5432
      SFTPGO_DATA_PROVIDER__NAME: ${POSTGRES_DB}
      SFTPGO_DATA_PROVIDER__USERNAME: ${POSTGRES_USER}
      SFTPGO_DATA_PROVIDER__PASSWORD: ${POSTGRES_PASSWORD}
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DATA_PROVIDER__USERS_BASE_DIR: /srv/menu-tv-sftp
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTP_ADMIN_USERNAME}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTP_ADMIN_PASSWORD}
      SFTPGO_SFTPD__BINDINGS__0__PORT: 2022
      SFTPGO_HTTPD__BINDINGS__0__ADDRESS: 0.0.0.0
      SFTPGO_HTTPD__BINDINGS__0__PORT: 8080
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN: "false"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT: "false"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_REST_API: "true"
      SFTPGO_TELEMETRY__BIND_PORT: 10000
    ports:
      - "${SFTP_PORT}:2022"
    volumes:
      - menu-tv-2-sftp-data:/srv/menu-tv-sftp
    restart: unless-stopped
    mem_limit: ${SFTP_MEMORY_LIMIT}
    pids_limit: ${SFTP_PIDS_LIMIT}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      sftp-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sftpgo", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - menu-tv-2-internal

  app:
    build:
      context: .
    image: menu-tv-2.0:local
    container_name: menu-tv-2.0
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: ${APP_MEMORY_LIMIT}
    pids_limit: ${APP_PIDS_LIMIT}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      sftp:
        condition: service_healthy
      sftp-storage-init:
        condition: service_completed_successfully
      site-assets-init:
        condition: service_completed_successfully
    volumes:
      - menu-tv-2-sftp-data:/srv/menu-tv-sftp
      - menu-tv-2-site-assets:${SITE_ASSETS_ROOT}
    networks:
      - menu-tv-2-internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=menu-tv-2-proxy
      - traefik.http.routers.menu-tv-2.rule=Host(`${MENU_TV_2_DOMAIN}`)
      - traefik.http.routers.menu-tv-2.entrypoints=websecure
      - traefik.http.routers.menu-tv-2.tls=true
      - traefik.http.routers.menu-tv-2.tls.certresolver=letsencrypt
      - traefik.http.services.menu-tv-2.loadbalancer.server.port=8080

volumes:
  menu-tv-2-db-data:
    name: menu-tv-2-db-data
  menu-tv-2-sftp-data:
    name: menu-tv-2-sftp-data
  menu-tv-2-site-assets:
    name: menu-tv-2-site-assets

networks:
  menu-tv-2-internal:
    name: menu-tv-2-internal
    internal: true
  proxy:
    external: true
    name: menu-tv-2-proxy
