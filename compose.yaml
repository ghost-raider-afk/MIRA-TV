name: mira-tv

services:
  db:
    image: postgres:17-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
    container_name: mira-tv-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - mira-tv-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT}
    pids_limit: ${DB_PIDS_LIMIT}
    networks: [mira-tv-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  site-assets-init:
    image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    container_name: mira-tv-site-assets-init
    env_file: [.env]
    command: >-
      sh -ec 'mkdir -p "$$SITE_ASSETS_ROOT" && chown 10001:11000 "$$SITE_ASSETS_ROOT" && chmod 2770 "$$SITE_ASSETS_ROOT"'
    volumes:
      - mira-tv-site-assets:${SITE_ASSETS_ROOT}
    network_mode: none
    restart: "no"

  app:
    build:
      context: .
    image: mira-tv:local
    container_name: mira-tv
    env_file: [.env]
    restart: unless-stopped
    mem_limit: ${APP_MEMORY_LIMIT}
    pids_limit: ${APP_PIDS_LIMIT}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
      site-assets-init:
        condition: service_completed_successfully
    volumes:
      - mira-tv-site-assets:${SITE_ASSETS_ROOT}
    networks: [mira-tv-internal, mira-tv-proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=mira-tv-proxy
      - traefik.http.routers.mira-tv.rule=Host(`${MIRA_TV_DOMAIN}`)
      - traefik.http.routers.mira-tv.entrypoints=websecure
      - traefik.http.routers.mira-tv.tls=true
      - traefik.http.routers.mira-tv.tls.certresolver=letsencrypt
      - traefik.http.services.mira-tv.loadbalancer.server.port=8080

  proxy:
    image: traefik:v3.7.12@sha256:5447d0eaf375d832b8f224f88db0e80c0a2d44554fc973e3ba72c3a52946cfcc
    container_name: mira-tv-proxy
    restart: unless-stopped
    mem_limit: ${PROXY_MEMORY_LIMIT}
    pids_limit: ${PROXY_PIDS_LIMIT}
    security_opt: [no-new-privileges:true]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${MIRA_TV_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - mira-tv-letsencrypt:/letsencrypt
    networks: [mira-tv-proxy]

volumes:
  mira-tv-db-data:
    name: mira-tv-db-data
  mira-tv-site-assets:
    name: mira-tv-site-assets
  mira-tv-letsencrypt:
    name: mira-tv-letsencrypt

networks:
  mira-tv-internal:
    name: mira-tv-internal
    internal: true
  mira-tv-proxy:
    name: mira-tv-proxy
