<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIRA-TV — Заявки</title>
  <script src="/theme-bootstrap.js"></script>
  <link rel="stylesheet" href="/css/index.css" />
  <script src="/app.js" defer></script>
</head>
<body data-page="approvals">
  <div class="app-shell"><div class="app-content">
    <main class="main-content workspace-content">
      <div class="page-heading"><p class="eyebrow">CRM / РАБОЧЕЕ МЕСТО</p><h1>Заявки</h1><p>Рассмотрение предложений, обращения менеджеров и история решений.</p></div>
      <section class="settings-card catalog-approvals-card" aria-labelledby="catalog-approvals-title">
            <div class="card-heading"><div><p class="eyebrow">ЗАЯВКИ</p><h2 id="catalog-approvals-title">Заявки и обращения</h2><p class="card-description">Все предложения менеджеров и сообщения, работа с заявками и история решений.</p></div><div class="catalog-approvals-controls"><label for="catalog-approvals-filter">Карточки</label><select id="catalog-approvals-filter" aria-label="Статус карточек"><option value="all">Все заявки</option><option value="pending">На рассмотрении</option><option value="history">История</option></select><button class="button button-secondary" id="refresh-catalog-approvals" type="button">Обновить</button></div></div>
            <p class="form-message is-hidden" id="catalog-approvals-message" role="status" aria-live="polite"></p>
            <div class="catalog-approvals-list" id="catalog-approvals-list" aria-live="polite"></div>
            <p class="empty-state is-hidden" id="catalog-approvals-empty">Новых предложений нет.</p>
          </section>
      <dialog class="catalog-approval-dialog" id="catalog-approval-dialog" aria-labelledby="catalog-approval-title">
      <section class="catalog-approval-panel">
        <header class="catalog-approval-head"><div><p class="eyebrow">СОГЛАСОВАНИЕ</p><h2 class="crm-request-title" id="catalog-approval-title">ПРЕДЛОЖЕНИЕ МЕНЕДЖЕРА</h2><p id="catalog-approval-meta"></p></div><button class="catalog-approval-close" id="catalog-approval-close" type="button" aria-label="Закрыть">×</button></header>
        <div class="catalog-approval-diff" id="catalog-approval-diff"></div>
        <label class="field" id="catalog-approval-comment-field"><span>Комментарий менеджеру</span><textarea id="catalog-approval-comment" maxlength="500" rows="3" placeholder="Необязательно"></textarea></label><p class="catalog-approval-history-detail" id="catalog-approval-history-detail" hidden></p>
        <p class="form-message is-hidden" id="catalog-approval-message" role="status" aria-live="polite"></p>
        <footer class="catalog-approval-actions"><button class="button button-secondary" id="catalog-approval-reject" type="button">Отклонить</button><button class="button button-primary" id="catalog-approval-approve" type="button">Принять изменение</button></footer>
      </section>
    </dialog>
    </main>
  </div></div>
</body>
</html>
