  </pattern>
</defs>

<rect width="1920" height="1080" fill="url(#board)"/>
<rect width="1920" height="1080" fill="url(#chalk)"/>

<!-- Approved chalk composition: one framed canvas, not a separate black rectangle on the right. -->
<rect x="50" y="28" width="1818" height="930" rx="24" fill="none" stroke="#e2b62d" stroke-width="2.5"/>
<path d="M1469 28V958" fill="none" stroke="#e2b62d" stroke-width="2"/>
<path d="M1483 226H1854" fill="none" stroke="#f3efe4" stroke-width="2" stroke-opacity=".72" stroke-linecap="round"/>

