    <stop stop-color="#13130f"/>
    <stop offset=".48" stop-color="#0b0c0a"/>
    <stop offset="1" stop-color="#141410"/>
  </linearGradient>
  <pattern id="chalk" width="58" height="58" patternUnits="userSpaceOnUse">
    <path d="M5 13l22-4M31 34l18-3M8 49l14-2" stroke="#f4efe1" stroke-opacity=".025" stroke-linecap="round"/>
    <circle cx="44" cy="12" r="1" fill="#f4efe1" fill-opacity=".034"/>
