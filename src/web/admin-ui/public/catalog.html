<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIRA-TV</title>
    <script src="/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="/css/index.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="catalog">
    <div class="app-shell">
      <div class="app-content">
        <main class="main-content catalog-page">
          <div class="page-heading compact-heading">
            <div><h1>Каталог</h1><p>Единая база позиций для сцен. Набор свойств определяется классом позиции.</p></div>
            <button class="button button-primary" id="create-catalog-item" type="button">+ Добавить</button>
          </div>

          <div class="catalog-toolbar" aria-label="Фильтры каталога">
            <label class="catalog-search"><span class="is-hidden">Поиск</span><input class="list-filter" id="catalog-filter" type="search" placeholder="Поиск по каталогу" aria-label="Поиск по каталогу" /></label>
            <label class="catalog-class-filter"><span>Класс</span><select id="catalog-class-filter"><option value="">Все классы</option></select></label>
            <button class="button button-secondary" id="refresh-catalog" type="button">Обновить</button>
          </div>

          <p class="form-message is-hidden" id="catalog-message" role="status" aria-live="polite"></p>

          <section class="catalog-grid-shell" aria-label="Позиции каталога">
            <table class="catalog-data-grid">
              <thead><tr><th>Название</th><th>Класс</th><th>Цена</th><th>Статус</th><th aria-label="Действия"></th></tr></thead>
              <tbody id="catalog-items-body"></tbody>
            </table>
            <div class="catalog-empty is-hidden" id="catalog-empty"><strong>Каталог пуст</strong><span>Добавьте первую позицию и выберите её класс.</span></div>
          </section>
        </main>
      </div>
    </div>

    <div class="workspace-drawer is-hidden" id="catalog-item-drawer" aria-hidden="true" data-route-surface>
      <button class="workspace-drawer-backdrop" id="catalog-item-drawer-backdrop" type="button" aria-label="Закрыть"></button>
      <aside class="workspace-drawer-panel catalog-item-drawer-panel" aria-labelledby="catalog-item-form-title">
        <div class="workspace-drawer-head">
          <div><h2 id="catalog-item-form-title">Новая позиция</h2><p id="catalog-item-class-path" class="catalog-class-path"></p></div>
          <button class="workspace-drawer-close" id="catalog-item-drawer-close" type="button" aria-label="Закрыть">×</button>
        </div>

        <form id="catalog-item-form" class="form-stack">
          <label class="field"><span>Класс</span><select id="catalog-item-class" required></select></label>
          <label class="field"><span>Название</span><input id="catalog-item-name" maxlength="160" required autocomplete="off" /></label>
          <label class="field"><span>Описание</span><textarea id="catalog-item-description" maxlength="1000" rows="3"></textarea></label>

          <div class="catalog-price-fields">
            <label class="field"><span>Базовая цена</span><input id="catalog-item-price" inputmode="decimal" maxlength="16" required /></label>
            <label class="field"><span>Количество</span><input id="catalog-item-quantity" inputmode="decimal" maxlength="16" value="1" required /></label>
            <label class="field"><span>Единица</span><input id="catalog-item-unit" maxlength="24" required /></label>
          </div>
          <small id="catalog-pricing-hint" class="catalog-pricing-hint"></small>

          <section class="catalog-class-fields is-hidden" id="catalog-class-fields" aria-label="Свойства класса">
            <div class="catalog-class-fields-head"><strong>Свойства класса</strong><span id="catalog-class-description"></span></div>
            <div class="catalog-class-fields-body" id="catalog-class-fields-body"></div>
          </section>

          <label class="toggle-row"><span><strong>Активна</strong><small>Активные позиции доступны элементам сцены.</small></span><input id="catalog-item-active" type="checkbox" checked /><i aria-hidden="true"></i></label>
          <div class="form-actions"><button class="button button-secondary" id="catalog-item-cancel" type="button">Отменить</button><button class="button button-primary" id="catalog-item-submit" type="submit">Добавить</button></div>
        </form>
      </aside>
    </div>
  </body>
</html>
