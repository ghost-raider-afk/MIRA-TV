<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIRA-TV</title>
    <script src="/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="/css/index.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="profile">
    <div class="app-shell">
      <div class="app-content">
        <main class="main-content profile-content">
          <div class="page-heading"><p class="eyebrow">ПРОФИЛЬ</p><h1>Настройки пользователя</h1><p>Личные данные, тема интерфейса и уведомления.</p></div>
          <section class="settings-card profile-card" aria-labelledby="profile-title">
            <div class="card-heading"><div><p class="eyebrow">УЧЁТНАЯ ЗАПИСЬ</p><h2 id="profile-title">Ваш профиль</h2></div></div>
            <form id="user-settings-form" class="form-grid">
              <label class="field"><span>Логин</span><input id="profile-username" type="text" disabled /></label>
              <label class="field"><span>Имя для отображения</span><input id="display-name" name="display_name" type="text" maxlength="80" required /></label>
              <label class="field"><span>E-mail</span><input id="profile-email" name="email" type="email" maxlength="160" /></label>
              <label class="field"><span>Телефон</span><input id="profile-phone" name="phone" type="tel" maxlength="40" /></label>
              <label class="field field-full"><span>Должность</span><input id="profile-job-title" name="job_title" type="text" maxlength="80" /></label>
              <div class="field field-full"><span>Тема интерфейса</span><div class="theme-options" role="radiogroup" aria-label="Тема интерфейса"><label><input type="radio" name="theme" value="system" />Системная</label><label><input type="radio" name="theme" value="light" />Светлая</label><label><input type="radio" name="theme" value="dark" />Тёмная</label></div></div>
              <label class="toggle-row field-full"><span><strong>Уведомления</strong><small>Показывать новые действия в колокольчике.</small></span><input id="notifications-enabled" name="notifications_enabled" type="checkbox" /><i aria-hidden="true"></i></label>
              <p class="form-message is-hidden field-full" id="user-settings-message" role="status" aria-live="polite"></p>
              <div class="form-actions field-full"><button class="button button-primary" id="user-settings-submit" type="submit">Сохранить настройки пользователя</button></div>
            </form>
          </section>
          <section class="settings-card profile-card" aria-labelledby="password-title">
            <div class="card-heading"><div><p class="eyebrow">БЕЗОПАСНОСТЬ</p><h2 id="password-title">Смена пароля</h2></div></div>
            <form id="password-change-form" class="form-grid">
              <label class="field field-full"><span>Текущий пароль</span><input id="current-password" type="password" autocomplete="current-password" required /></label>
              <label class="field"><span>Новый пароль</span><input id="new-password" type="password" autocomplete="new-password" required /></label>
              <label class="field"><span>Подтвердите новый пароль</span><input id="new-password-confirmation" type="password" autocomplete="new-password" required /></label>
              <p class="muted-copy field-full">Требования к длине и составу пароля определяются конфигурацией сервера.</p>
              <p class="form-message is-hidden field-full" id="password-change-message" role="status" aria-live="polite"></p>
              <div class="form-actions field-full"><button class="button button-primary" id="password-change-submit" type="submit">Изменить пароль</button></div>
            </form>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
