<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIRA-TV</title>
    <script src="/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="/css/index.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="scene-editor">
    <div class="app-shell">
      <div class="app-content">
        <main class="main-content scene-editor-page">
          <section class="scene-editor-toolbar">
            <div class="scene-editor-title">
              <a class="editor-back" href="/scenes" aria-label="К сценам">←</a>
              <div>
                <p class="eyebrow">СЦЕНА</p>
                <div class="scene-title-line">
                  <input id="scene-name" class="scene-name-input" maxlength="120" value="Новая сцена" aria-label="Название сцены" />
                  <span id="scene-save-state" class="scene-save-state" aria-live="polite">Сохранено</span>
                </div>
              </div>
            </div>
            <div class="scene-toolbar-controls">
              <label class="scene-display-select">Телевизоры
                <select id="scene-display-count" aria-label="Количество телевизоров в горизонтальном ряду">
                  <option value="1">1 TV · 1920×1080</option>
                  <option value="2">2 TV · 3840×1080</option>
                  <option value="3">3 TV · 5760×1080</option>
                  <option value="4">4 TV · 7680×1080</option>
                  <option value="5">5 TV · 9600×1080</option>
                  <option value="6">6 TV · 11520×1080</option>
                </select>
              </label>
              <button class="button button-secondary" id="scene-preview-toggle" type="button">Предпросмотр</button>
              <button class="button button-secondary" id="scene-save" type="button">Сохранить</button>
              <button class="button button-primary" id="scene-publish" type="button">Опубликовать</button>
            </div>
          </section>

          <p class="form-message is-hidden" id="scene-editor-message" role="status" aria-live="polite"></p>

          <div class="scene-editor-layout">
            <aside class="scene-tools-panel" aria-label="Инструменты сцены">
              <div class="scene-panel-heading"><p class="eyebrow">ДОБАВИТЬ</p><h2>Элементы</h2></div>
              <div class="scene-tool-grid">
                <button type="button" data-add-element="table"><strong>Таблица</strong><span>Реальный каталог и цены</span></button>
                <button type="button" data-add-element="text"><strong>Текст</strong><span>Заголовки и подписи</span></button>
                <button type="button" data-add-element="image"><strong>Изображение</strong><span>Фото и графика</span></button>
                <button type="button" data-add-element="logo"><strong>Логотип</strong><span>Бренд</span></button>
                <button type="button" data-add-element="video"><strong>Видео</strong><span>Медиаобъект</span></button>
                <button type="button" data-add-element="weather"><strong>Погода</strong><span>Информер</span></button>
                <button type="button" data-add-element="clock"><strong>Часы</strong><span>Несколько видов</span></button>
                <button type="button" data-add-element="shape"><strong>Фигура</strong><span>Подложка и декор</span></button>
              </div>
              <div class="scene-background-tools"><p class="eyebrow">ФОН СЛАЙДА</p><label class="field"><span>Цвет</span><input id="slide-background-color" type="color" value="#10141c" /></label></div>
            </aside>

            <section class="scene-stage-column">
              <div class="scene-stage-meta"><span id="scene-resolution-label">1920 × 1080</span><span>Границы физических TV показаны направляющими</span></div>
              <div class="scene-stage-shell" id="scene-stage-shell">
                <div class="scene-stage" id="scene-stage" tabindex="0" aria-label="Холст сцены">
                  <div class="scene-tv-guides" id="scene-tv-guides" aria-hidden="true"></div>
                  <div class="scene-elements-layer" id="scene-elements-layer"></div>
                </div>
              </div>
            </section>

            <aside class="scene-inspector" aria-label="Свойства выбранного элемента">
              <div class="scene-panel-heading"><p class="eyebrow">СВОЙСТВА</p><h2 id="inspector-title">Слайд</h2></div>
              <div id="inspector-empty" class="scene-inspector-empty">Выберите элемент на холсте, чтобы изменить его параметры.</div>
              <div id="inspector-fields" class="scene-inspector-fields is-hidden">
                <div class="scene-inspector-actions"><button class="button button-secondary" id="element-backward" type="button">Слой −</button><button class="button button-secondary" id="element-forward" type="button">Слой +</button><button class="button button-danger" id="element-delete" type="button">Удалить</button></div>
                <div class="geometry-grid">
                  <label class="field"><span>X</span><input id="element-x" type="number" min="0" step="1" /></label>
                  <label class="field"><span>Y</span><input id="element-y" type="number" min="0" step="1" /></label>
                  <label class="field"><span>Ширина</span><input id="element-width" type="number" min="20" step="1" /></label>
                  <label class="field"><span>Высота</span><input id="element-height" type="number" min="20" step="1" /></label>
                </div>
                <label class="field"><span id="element-content-label">Содержимое</span><input id="element-content" maxlength="160" /></label>

                <details id="table-settings" class="is-hidden" open>
                  <summary>Данные таблицы</summary>
                  <div class="scene-table-settings">
                    <div class="scene-data-source-line"><div><strong>Каталог MIRA-TV</strong><small id="table-catalog-status">Каталог загружается…</small></div><button class="button button-secondary" id="table-refresh-catalog" type="button">Обновить</button></div>
                    <label class="field"><span>Цены для объёмов, л</span><input id="table-volumes" inputmode="decimal" placeholder="0,5; 1; 1,5" /><small>Можно указать любые объёмы через точку с запятой. Цена рассчитывается от базовой цены за 1 л.</small></label>
                    <label class="field"><span>Строк на экране</span><input id="table-row-limit" type="number" min="1" max="50" step="1" /></label>
                    <div class="scene-toggle-list scene-table-columns">
                      <label><span>Только активные</span><input id="table-active-only" type="checkbox" /></label>
                      <label><span>Производитель</span><input id="table-show-producer" type="checkbox" /></label>
                      <label><span>Крепость</span><input id="table-show-strength" type="checkbox" /></label>
                      <label><span>Цвет напитка</span><input id="table-show-color" type="checkbox" /></label>
                      <label><span>Фильтрация</span><input id="table-show-filtration" type="checkbox" /></label>
                    </div>
                  </div>
                </details>

                <label class="field"><span>Цвет текста</span><input id="element-color" type="color" /></label>
                <label class="field"><span>Фон элемента</span><input id="element-background" type="text" placeholder="transparent или CSS-цвет" /></label>
                <label class="field"><span>Размер текста</span><input id="element-font-size" type="number" min="12" max="180" step="1" /></label>
                <label class="field"><span>Прозрачность</span><input id="element-opacity" type="range" min="0.1" max="1" step="0.05" /></label>
                <label class="field"><span>Вариант</span><select id="element-variant"><option value="default">По умолчанию</option><option value="compact">Компактный</option><option value="digital">Цифровой</option><option value="forecast">Прогноз</option><option value="minimal">Минималистичный</option></select></label>
                <details open><summary>Эффекты</summary><div class="scene-toggle-list"><label><span>Тень</span><input id="element-shadow" type="checkbox" /></label><label><span>Свечение</span><input id="element-glow" type="checkbox" /></label></div></details>
                <details><summary>Анимация</summary><div class="scene-animation-grid"><label class="field"><span>Появление</span><select id="element-entrance"><option value="none">Нет</option><option value="fade">Fade</option><option value="slide-up">Slide up</option><option value="scale">Scale</option></select></label><label class="field"><span>Постоянная</span><select id="element-loop"><option value="none">Нет</option><option value="pulse">Pulse</option><option value="float">Float</option></select></label><label class="field"><span>Исчезновение</span><select id="element-exit"><option value="none">Нет</option><option value="fade">Fade</option><option value="scale">Scale</option></select></label></div></details>
              </div>
            </aside>
          </div>

          <section class="scene-slides-bar" aria-label="Слайды сцены"><div class="scene-slides-head"><div><p class="eyebrow">СЛАЙДЫ</p><strong>Сценарий показа</strong></div><button class="button button-secondary" id="add-slide" type="button">+ Добавить слайд</button></div><div class="scene-slide-list" id="scene-slide-list"></div></section>
        </main>
      </div>
    </div>
  </body>
</html>
