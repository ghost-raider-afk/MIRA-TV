<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIRA-TV</title>
    <script src="/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="/css/index.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="scenes">
    <div class="app-shell">
      <div class="app-content">
        <main class="main-content scenes-page">
          <div class="page-heading compact-heading">
            <div><p class="eyebrow">КОНТЕНТ</p><h1>Сцены</h1><p>Создавайте готовые экраны и слайды, затем публикуйте их на нужные телевизоры.</p></div>
            <button class="button button-primary" id="create-scene" type="button">+ Новая сцена</button>
          </div>
          <p class="form-message is-hidden" id="scenes-message" role="status"></p>
          <section class="scene-library" id="scene-library" aria-live="polite"></section>
          <div class="scene-empty is-hidden" id="scene-empty">
            <div class="scene-empty-icon">＋</div>
            <strong>Создайте первую сцену</strong>
            <span>Начните с пустого слайда и добавьте таблицу, текст, медиа, часы или погоду.</span>
            <button class="button button-primary" id="create-first-scene" type="button">Новая сцена</button>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
