<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIRA-TV</title>
    <script src="/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="/css/index.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="screens">
    <div class="app-shell">
      <div class="app-content">
        <main class="main-content screens-page">
          <div class="page-heading compact-heading">
            <div><p class="eyebrow">ПОКАЗ</p><h1>Мониторы</h1><p>Назначайте опубликованные сцены телевизорам и контролируйте подключение. Дизайн контента здесь не редактируется.</p></div>
            <div class="compact-heading-actions"><button class="button button-secondary" id="refresh-screens" type="button">Обновить</button><a class="button button-primary" href="/connect-tv">+ Подключить ТВ</a></div>
          </div>
          <p class="form-message is-hidden" id="screens-message" role="status"></p>
          <div class="screen-hierarchy" data-screen-hierarchy></div>
          <section class="settings-card screen-empty-page is-hidden" data-screens-empty><strong>Сначала создайте торговую точку</strong><p>После этого здесь можно создать монитор и привязать к нему телевизор.</p><a class="button button-primary" href="/locations">Создать точку</a></section>
        </main>
      </div>
    </div>
  </body>
</html>
